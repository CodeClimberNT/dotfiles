# ~/.config/starship.toml
add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$memory_usage\
$line_break\
$nodejs\
$rust\
$python\
$character"""

[directory]
  style = "blue"

[character]
  success_symbol = "[❯](purple)"
  error_symbol   = "[❯](red)"
  vimcmd_symbol  = "[❮](green)"

[git_branch]
  format = "[$symbol $branch(:$remote_branch) ]($style)"
  symbol = ""
  style  = "bright-black"

[git_status]
  format     = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
  style      = "cyan"
  conflicted = ""
  untracked  = ""
  modified   = ""
  staged     = ""
  renamed    = ""
  deleted    = ""
  stashed    = "≡"

[git_state]
  format = '\([$state( $progress_current/$progress_total)]($style)\) '
  style  = "bright-black"

[cmd_duration]
  format = "[$duration]($style) "
  style  = "yellow"

[memory_usage]
  threshold = 40
  format    = "$symbol[${ram}( | ${swap})]($style)"
  style     = "bright-black"
  disabled  = false

[rust]
  style  = "bright-black"
  format = "[[$symbol($version)](fg:#769ff0)]($style)"

[nodejs]
  format = "[[$symbol($version)](fg:#769ff0)]($style)"
  style  = "bright-black"

[python]
  format = "[[$symbol($version $virtualenv)](fg:#769ff0)]($style)"
  style  = "bright-black"
